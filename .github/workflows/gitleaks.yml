# Secret scanning: fails the PR if a credential-looking string is committed
# anywhere in the history being pushed.
name: gitleaks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  # gitleaks-action lists the PR's commits via the API on pull_request events.
  pull-requests: read

jobs:
  scan:
    runs-on: [self-hosted, general]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
