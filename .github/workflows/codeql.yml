# Static security analysis (CodeQL) for the TypeScript/JavaScript codebase.
#
# Uploading results to the GitHub Code Scanning service needs paid Code
# Security on this account's plan, so instead the job inspects the SARIF
# output itself and fails when CodeQL reports any finding. Switch
# `upload: never` off and add `security-events: write` back once Code
# Security is available, to get the Security-tab experience.
#
# runs-on falls back to a GitHub-hosted runner for pull_request runs from a
# fork (this repo is public): the self-hosted general-tier runner has
# passwordless sudo and is shared with other repos, so a fork PR's code must
# never execute there. Same-repo pushes/PRs still use it as normal.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: read
  # The analyze step reads its own workflow-run metadata for the status
  # report — without this it errors out even though the SARIF is already
  # written.
  actions: read
  # Read-only: lets the action query its API for feature flags. A residual
  # "Code scanning is not enabled" notice may remain — that part is not
  # fixable without paid Code Security.
  security-events: read

jobs:
  analyze:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "general"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          upload: never
          output: codeql-results

      - name: Fail on CodeQL findings
        run: |
          count=$(jq -s '[.[].runs[].results[]] | length' codeql-results/*.sarif)
          echo "CodeQL findings: ${count}"
          if [ "$count" -gt 0 ]; then
            jq -r -s '
              .[].runs[] as $run |
              $run.results[] |
              "\(.ruleId) — \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine): \(.message.text)"
            ' codeql-results/*.sarif
            echo "::error::CodeQL reported ${count} finding(s) — see the list above"
            exit 1
          fi
