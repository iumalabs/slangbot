# Production deploys happen only from main, only through this workflow:
# push to main (or run it manually from the Actions tab) → lint + tests →
# `deno task deploy:production` → iuma.dev.
#
# Local `deno task deploy` stays preview-only (versions upload), so the
# workflow is the single path to production.
#
# One-time setup: create a Cloudflare API token (dashboard → My Profile →
# API Tokens → "Edit Cloudflare Workers" template, scoped to this account)
# and add it as the CLOUDFLARE_API_TOKEN repository secret.
name: Deploy production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31 # v1.1.2
        with:
          deno-version: v2.x

      - name: Run linter
        run: deno task lint

      - name: Run tests
        run: deno test -A

      - name: Deploy to production
        run: deno task deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account id is not a secret; pinned here so the token can stay
          # narrowly scoped and wrangler never has to guess.
          CLOUDFLARE_ACCOUNT_ID: 8b655d0dde6d223b9ce11116a014973a
