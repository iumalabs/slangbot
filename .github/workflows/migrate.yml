# Applies pending D1 migrations to the production database.
#
# Runs automatically when a push to main touches migrations/**, and can be
# run manually from the Actions tab. Applying is idempotent (D1 tracks
# applied files in its d1_migrations table), so overlapping with the
# migration step in the Workers Builds deploy command is harmless — whichever
# runs first applies, the other no-ops.
#
# One-time setup: add a CLOUDFLARE_API_TOKEN repository secret whose token
# has the Account → D1 → Edit permission (the "Edit Cloudflare Workers"
# template plus D1 Edit works).
name: Apply D1 migrations

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["migrations/**"]

permissions:
  contents: read

concurrency:
  group: d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31 # v1.1.2
        with:
          deno-version: v2.x

      - name: Apply migrations to production D1
        run: deno task db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8b655d0dde6d223b9ce11116a014973a

      - name: Show migration status
        run: deno run -A npm:wrangler@latest d1 migrations list slangbot-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8b655d0dde6d223b9ce11116a014973a
