# Manually trigger the daily slangbot pipeline without waiting for the
# Worker's own cron (00:00 UTC). Authenticates to the Access-protected
# /admin/* routes with a Cloudflare Access Service Token — see the
# "Manual trigger" section in README.md for one-time setup.
name: Trigger slangbot pipeline

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Regenerate a specific date (YYYY-MM-DD). Leave empty to just run today's pipeline (safe to re-run; upserts by date)."
        required: false
        type: string
      imageOnly:
        description: "Only regenerate the illustration for the given date (requires date)."
        required: false
        type: boolean
        default: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call admin endpoint
        env:
          BASE_URL: ${{ vars.SLANGBOT_BASE_URL || 'https://iuma.dev' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DATE: ${{ inputs.date }}
          IMAGE_ONLY: ${{ inputs.imageOnly }}
        run: |
          set -euo pipefail

          if [ -n "$DATE" ]; then
            echo "Regenerating entry for $DATE (imageOnly=$IMAGE_ONLY)..."
            body="date=$DATE"
            if [ "$IMAGE_ONLY" = "true" ]; then
              body="$body&imageOnly=1"
            fi
            url="$BASE_URL/admin/regenerate"
          else
            echo "Running today's pipeline..."
            body=""
            url="$BASE_URL/admin/run"
          fi

          response=$(curl -sS -w '\n%{http_code}' -X POST "$url" \
            -H "Accept: application/json" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --data "$body")

          http_code=$(echo "$response" | tail -n1)
          payload=$(echo "$response" | sed '$d')

          echo "HTTP $http_code"
          echo "$payload"

          if [ "$http_code" -ge 400 ]; then
            echo "::error::Pipeline trigger failed with HTTP $http_code"
            exit 1
          fi
