# slangbot — autonomous slang-of-the-day dictionary.
# Production domain: slangbot.maksimyugai.com (see the [[routes]] block below).

name = "slangbot"
main = "src/index.tsx"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
# Versioned preview URLs (<version>-iuma.<subdomain>.workers.dev). Deploys
# run exclusively through the Cloudflare Workers <-> GitHub integration
# (Workers Builds): pushes to main deploy to production, pushes to any other
# branch upload a preview version. See "Deploys" in the README.
# Protect previews with Access in the dashboard (see README).
preview_urls = true

[[routes]]
pattern = "slangbot.maksimyugai.com"
custom_domain = true

[assets]
directory = "assets"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "iuma-db"
database_id = "fce762c2-3984-4803-960c-64e416e970ac"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "c7e3c6e69ff5484fbf37721905777f66"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "iuma-images"

[triggers]
crons = ["0 0 * * *"]

[vars]
# Cloudflare Turnstile *test* site key (always passes). Replace for production.
TURNSTILE_SITE_KEY = "0x4AAAAAADxJh02sjUerG64f"
# Your Cloudflare Zero Trust team domain, e.g. "myteam.cloudflareaccess.com".
ACCESS_TEAM_DOMAIN = "yugai"
# Cloudflare Access application AUD tag (public identifier, not a secret —
# it is visible in every Access JWT payload). Copy from the Access app's
# Overview page in the Zero Trust dashboard.
ADMIN_ACCESS_AUD = "124c4d91816b347e640227f38be8b261ee3dc22481c6c9601ed6f114a9a288b9"
# Feature flag for the Telegram autopost step (t.me/daily_slangbot): the daily
# word is posted as illustration + A/B/C definitions + a native quiz poll.
# Requires the TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL_ID secrets.
TELEGRAM_ENABLED = "true"
# Language of the channel post: "en" or "ru". The entry data is bilingual,
# so this only switches which definitions/scaffolding are shown and which
# locale the permalink points to.
TELEGRAM_LOCALE = "ru"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   TURNSTILE_SECRET      — Turnstile secret key
#   COOKIE_HMAC_SECRET    — random string used to sign visitor cookies
#   TELEGRAM_BOT_TOKEN    — optional, only if TELEGRAM_ENABLED = "true"
#   TELEGRAM_CHANNEL_ID   — optional, only if TELEGRAM_ENABLED = "true"
