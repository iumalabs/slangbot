# iuma — autonomous slang-of-the-day dictionary.
# NOTE: no custom domain / routes here on purpose: the owner attaches iuma.dev
# manually in the Cloudflare dashboard. This config deploys to workers.dev.

name = "iuma"
main = "src/index.tsx"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false

[[routes]]
pattern = "iuma.dev"
custom_domain = true

[assets]
directory = "assets"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "iuma-db"
database_id = "fce762c2-3984-4803-960c-64e416e970ac"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "c7e3c6e69ff5484fbf37721905777f66"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "iuma-images"

[triggers]
crons = ["0 0 * * *"]

[vars]
# Cloudflare Turnstile *test* site key (always passes). Replace for production.
TURNSTILE_SITE_KEY = "0x4AAAAAADxJh02sjUerG64f"
# Your Cloudflare Zero Trust team domain, e.g. "myteam.cloudflareaccess.com".
ACCESS_TEAM_DOMAIN = "yugai"
# Cloudflare Access application AUD tag (public identifier, not a secret —
# it is visible in every Access JWT payload). Copy from the Access app's
# Overview page in the Zero Trust dashboard.
ADMIN_ACCESS_AUD = "124c4d91816b347e640227f38be8b261ee3dc22481c6c9601ed6f114a9a288b9"
# Feature flag for the Telegram autopost step ("true" to enable).
TELEGRAM_ENABLED = "false"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   TURNSTILE_SECRET      — Turnstile secret key
#   COOKIE_HMAC_SECRET    — random string used to sign visitor cookies
#   TELEGRAM_BOT_TOKEN    — optional, only if TELEGRAM_ENABLED = "true"
#   TELEGRAM_CHANNEL_ID   — optional, only if TELEGRAM_ENABLED = "true"
